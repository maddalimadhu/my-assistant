<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2b5cd9">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>My Assistant</title>
<style>
:root{
  --bg:#f4f5f7;--panel:#fff;--text:#1d2129;--muted:#667085;--line:#e4e7ec;
  --accent:#2b5cd9;--accent-soft:#e8eefc;--red:#c0262d;--red-soft:#fcebec;--green:#0f7b3f;--amber:#9a5b00;--amber-soft:#fdf3e1;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1115;--panel:#181b21;--text:#e6e8ec;--muted:#98a2b3;--line:#2a2f38;
  --accent:#7aa2ff;--accent-soft:#1e2a47;--red:#ff7a7a;--red-soft:#3a1a1c;--green:#4cc38a;--amber:#f0b35a;--amber-soft:#3a2c14;--shadow:none;}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
.app{max-width:640px;margin:0 auto;min-height:100vh;padding:0 16px calc(150px + env(safe-area-inset-bottom))}
header{padding:calc(18px + env(safe-area-inset-top)) 0 10px;display:flex;align-items:flex-start;gap:10px}
header .t{flex:1}
h1{font-size:24px;margin:0;line-height:1.2}
.sub{color:var(--muted);font-size:14px;margin-top:2px}
.iconbtn{border:0;background:var(--panel);color:var(--text);width:40px;height:40px;border-radius:12px;box-shadow:var(--shadow);font-size:18px;cursor:pointer;display:grid;place-items:center}
.banner{background:var(--accent-soft);color:var(--accent);border-radius:12px;padding:10px 12px;font-size:14px;display:flex;gap:10px;align-items:center;margin:6px 0 10px}
.banner button{margin-left:auto;border:0;background:var(--accent);color:#fff;border-radius:8px;padding:6px 12px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.tabs{display:flex;gap:6px;margin:8px 0 12px;position:sticky;top:0;background:var(--bg);padding:6px 0;z-index:5}
.tab{flex:1;border:0;background:var(--panel);color:var(--muted);border-radius:10px;padding:9px 4px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;box-shadow:var(--shadow)}
.tab.on{background:var(--accent);color:#fff}
.tab span{font-size:12px;opacity:.85;margin-left:3px}
.section{font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);margin:16px 4px 6px}
.section.red{color:var(--red)}
.task{background:var(--panel);border-radius:12px;box-shadow:var(--shadow);display:flex;align-items:center;gap:12px;padding:12px;margin-bottom:8px;border:1px solid var(--line)}
.check{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--muted);background:none;cursor:pointer;display:grid;place-items:center;color:#fff;font-size:14px}
.task.high .check{border-color:var(--red)}
.task.done .check{background:var(--green);border-color:var(--green)}
.task .body{flex:1;min-width:0;cursor:pointer}
.task .title{word-wrap:break-word}
.task.done .title{text-decoration:line-through;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:3px}
.chip{font-size:12px;font-weight:600;border-radius:6px;padding:1px 7px;background:var(--accent-soft);color:var(--accent)}
.chip.late{background:var(--red-soft);color:var(--red)}
.chip.rep{background:var(--amber-soft);color:var(--amber)}
.chip.pri{background:var(--red-soft);color:var(--red)}
.empty{text-align:center;color:var(--muted);padding:40px 20px}
.empty b{display:block;color:var(--text);font-size:18px;margin-bottom:4px}
/* composer */
.composer{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(transparent,var(--bg) 22%);padding:22px 16px calc(14px + env(safe-area-inset-bottom));z-index:10}
.composer .in{max-width:608px;margin:0 auto}
.preview{font-size:13px;color:var(--accent);min-height:20px;margin:0 6px 6px;font-weight:600}
.bar{display:flex;gap:8px;background:var(--panel);border-radius:16px;box-shadow:0 4px 18px rgba(0,0,0,.12);padding:6px;border:1px solid var(--line)}
.bar input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--text);font:inherit;padding:10px 8px}
.bar button{border:0;border-radius:12px;width:46px;height:46px;font-size:20px;cursor:pointer;flex:none}
#mic{background:var(--accent-soft);color:var(--accent)}
#mic.live{background:var(--red);color:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.6}}
#add{background:var(--accent);color:#fff;font-size:26px;line-height:1}
.hint{font-size:12px;color:var(--muted);text-align:center;margin-top:6px}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-radius:18px 18px 0 0;z-index:21;padding:18px 16px calc(18px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .22s;max-width:640px;margin:0 auto;max-height:85vh;overflow:auto}
.sheet.open{transform:none}.scrim.open{display:block}
.sheet h3{margin:0 0 10px;font-size:17px}
.sheet input[type=text],.sheet input[type=datetime-local],.sheet select{width:100%;font:inherit;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);margin-bottom:10px}
.sheet label{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;display:block;margin:4px 0 4px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 10px}
.btn{border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:10px;padding:9px 12px;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--red)}
.row{display:flex;gap:8px}.row>*{flex:1}
.note{font-size:13px;color:var(--muted);line-height:1.5}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%);background:#1d2129;color:#fff;border-radius:10px;padding:10px 14px;font-size:14px;z-index:30;display:none;gap:12px;align-items:center;max-width:90vw}
.toast button{border:0;background:none;color:#7aa2ff;font:inherit;font-weight:700;cursor:pointer}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="t"><h1 id="hello">Hello</h1><div class="sub" id="summary"></div></div>
    <button class="iconbtn" id="settingsBtn" aria-label="Settings">⚙</button>
  </header>
  <div class="banner" id="installBanner" hidden>Install this app on your phone <button id="installBtn">Install</button></div>
  <div class="banner" id="notifBanner" hidden>Turn on reminder notifications <button id="notifBtn">Turn on</button></div>
  <div class="tabs">
    <button class="tab on" data-view="today">Today<span id="cToday"></span></button>
    <button class="tab" data-view="upcoming">Upcoming<span id="cUp"></span></button>
    <button class="tab" data-view="done">Done<span id="cDone"></span></button>
  </div>
  <div id="list"></div>
</div>

<div class="composer"><div class="in">
  <div class="preview" id="preview"></div>
  <div class="bar">
    <button id="mic" aria-label="Speak" title="Speak">🎤</button>
    <input id="text" placeholder="e.g. Call mom tomorrow at 6pm" autocomplete="off" enterkeyhint="done">
    <button id="add" aria-label="Add">+</button>
  </div>
  <div class="hint">Try: "pay rent on oct 30" · "gym every day at 7am" · "call bank in 2 hours !"</div>
</div></div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"><span id="toastMsg"></span><button id="toastBtn"></button></div>

<script>
// ================= STORAGE =================
const KEY = "assistant.tasks", SKEY = "assistant.settings";
const load = (k, d) => { try{ const v = JSON.parse(localStorage.getItem(k)); return v ?? d; }catch(e){ return d; } };
const store = (k, v) => { try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} };
let tasks = load(KEY, []), settings = load(SKEY, {name:""}), view = "today";
const save = () => { store(KEY, tasks); render(); };
const $ = id => document.getElementById(id);

// ================= THE "UNDERSTANDING" PART: plain English -> task =================
const DAYS = ["sunday","monday","tuesday","wednesday","thursday","friday","saturday"];
const DAYRE = "(sunday|monday|tuesday|wednesday|thursday|friday|saturday|sun|mon|tues|tue|wed|thurs|thur|thu|fri|sat)";
const MONTHS = ["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"];
const MONRE = "(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\\.?";
const dayIndex = w => DAYS.findIndex(d => d.startsWith(w.toLowerCase().slice(0,3)));
const startOfDay = d => { const x = new Date(d); x.setHours(0,0,0,0); return x; };

function parse(input){
  let s = " " + input.trim() + " ";
  const take = re => { const m = s.match(re); if(m) s = s.replace(m[0], " "); return m; };
  const now = new Date();
  let day = null, time = null, repeat = null, high = false, exact = null, m;

  take(/^\s*(remind me to|remind me|remember to|i need to|i have to|todo:?)\s+/i);
  if(take(/\b(every\s*day|daily|each day)\b/i)) repeat = "daily";
  else if(take(/\b(every\s*month|monthly)\b/i)) repeat = "monthly";
  else if((m = take(new RegExp("\\bevery\\s+" + DAYRE + "\\b", "i")))){ repeat = "weekly"; day = nextWeekday(dayIndex(m[1]), false); }
  else if(take(/\b(every\s*week|weekly)\b/i)) repeat = "weekly";

  if((m = take(/\bin\s+(\d+|an?|one)\s*(minutes?|mins?|m|hours?|hrs?|h|days?|d)\b/i))){
    const n = /^\d+$/.test(m[1]) ? +m[1] : 1, u = m[2][0].toLowerCase();
    exact = new Date(now.getTime() + n * (u === "m" ? 6e4 : u === "h" ? 36e5 : 864e5));
  }
  if(take(/\bday after tomorrow\b/i)) day = addDays(now, 2);
  else if(take(/\b(tomorrow|tmrw|tmr)\b/i)) day = addDays(now, 1);
  else if(take(/\btoday\b/i)) day = startOfDay(now);
  if(take(/\btonight\b/i)){ day = day || startOfDay(now);
    time = time || (now.getHours() >= 20 ? {h:Math.min(23, now.getHours() + 1), m:0} : {h:20, m:0}); }   // late already? next hour
  if(!day && (m = take(new RegExp("\\b(?:on\\s+|this\\s+)?(next\\s+)?" + DAYRE + "\\b", "i")))) day = nextWeekday(dayIndex(m[2]), !!m[1]);
  if(!day && (m = take(new RegExp("\\b(?:on\\s+)?" + MONRE + "\\s+(\\d{1,2})(?:st|nd|rd|th)?\\b", "i")))) day = monthDay(m[1], +m[2]);
  if(!day && (m = take(new RegExp("\\b(?:on\\s+)?(\\d{1,2})(?:st|nd|rd|th)?\\s+(?:of\\s+)?" + MONRE + "\\b", "i")))) day = monthDay(m[2], +m[1]);

  if((m = take(/\b(?:at\s+|by\s+)?(\d{1,2})(?::(\d{2}))?\s*(am|pm|a\.m\.|p\.m\.)(?=\W)/i))){
    let h = +m[1] % 12; if(/^p/i.test(m[3])) h += 12; time = {h, m:+(m[2] || 0)};
  } else if((m = take(/\b(?:at|by)\s+(\d{1,2}):(\d{2})\b/i))) time = {h:+m[1], m:+m[2]};
  else if((m = take(/\b(?:at|by)\s+(\d{1,2})\b/i))){ let h = +m[1]; if(h >= 1 && h <= 7) h += 12; time = {h, m:0}; }
  else if(take(/\b(at\s+)?noon\b/i)) time = {h:12, m:0};
  else if(take(/\b(in the\s+|this\s+)?morning\b/i)) time = {h:9, m:0};
  else if(take(/\b(in the\s+|this\s+)?afternoon\b/i)) time = {h:15, m:0};
  else if(take(/\b(in the\s+|this\s+)?evening\b/i)) time = {h:18, m:0};

  if(take(/(^|\s)!+(?=\s)/) || take(/\b(urgent|important|asap|high priority)\b/i)) high = true;

  let due = null;
  if(exact) due = exact;
  else if(day || time || repeat){
    const t = time || {h:9, m:0};
    due = new Date(day || startOfDay(now)); due.setHours(t.h, t.m, 0, 0);
    if(!day && due <= now) due = addDays(due, 1, true);           // "at 6pm" when it's already 7pm -> tomorrow
  }
  let title = s.replace(/\s+/g, " ").replace(/\s+(at|on|by|in|for)\s*$/i, "").trim();
  title = title.charAt(0).toUpperCase() + title.slice(1);
  return {title, due: due ? due.getTime() : null, repeat, high};
}
function addDays(d, n, keepTime){ const x = keepTime ? new Date(d) : startOfDay(d); x.setDate(x.getDate() + n); return x; }
function nextWeekday(idx, forceNext){
  const today = startOfDay(new Date()); let diff = (idx - today.getDay() + 7) % 7;
  if(forceNext && diff === 0) diff = 7;
  return addDays(today, diff);
}
function monthDay(mon, d){
  const now = new Date(), mi = MONTHS.indexOf(mon.toLowerCase().slice(0,3));
  let x = new Date(now.getFullYear(), mi, d); if(x < startOfDay(now)) x = new Date(now.getFullYear() + 1, mi, d);
  return x;
}
function nextOccurrence(t){
  let d = new Date(t.due || Date.now());
  do{
    if(t.repeat === "daily") d.setDate(d.getDate() + 1);
    else if(t.repeat === "weekly") d.setDate(d.getDate() + 7);
    else d.setMonth(d.getMonth() + 1);
  }while(d.getTime() <= Date.now());
  return d.getTime();
}

// ================= FORMATTING =================
function fmtDue(ms){
  const d = new Date(ms), today = startOfDay(new Date()), dd = startOfDay(d), diff = Math.round((dd - today) / 864e5);
  const time = d.toLocaleTimeString([], {hour:"numeric", minute:"2-digit"});
  const dayTxt = diff === 0 ? "Today" : diff === 1 ? "Tomorrow" : diff === -1 ? "Yesterday" :
    diff > 1 && diff < 7 ? d.toLocaleDateString([], {weekday:"long"}) : d.toLocaleDateString([], {weekday:"short", month:"short", day:"numeric"});
  return `${dayTxt}, ${time}`;
}
function dayLabel(ms){ const f = fmtDue(ms); return f.slice(0, f.lastIndexOf(",")); }
const REP = {daily:"Every day", weekly:"Every week", monthly:"Every month"};

// ================= RENDER =================
function render(){
  const now = Date.now(), eod = addDays(new Date(), 1).getTime();
  const open = tasks.filter(t => !t.done);
  const overdue = open.filter(t => t.due && t.due < now).sort(byDue);
  const today = open.filter(t => t.due && t.due >= now && t.due < eod).sort(byDue);
  const anytime = open.filter(t => !t.due).sort((a,b) => (b.high - a.high) || a.created - b.created);
  const upcoming = open.filter(t => t.due && t.due >= eod).sort(byDue);
  const done = tasks.filter(t => t.done).sort((a,b) => b.doneAt - a.doneAt).slice(0, 60);

  const h = new Date().getHours(), greet = h < 12 ? "Good morning" : h < 17 ? "Good afternoon" : "Good evening";
  $("hello").textContent = greet + (settings.name ? ", " + settings.name : "");
  const bits = [new Date().toLocaleDateString([], {weekday:"long", month:"long", day:"numeric"})];
  bits.push(`${today.length} due today`); if(overdue.length) bits.push(`${overdue.length} overdue`);
  $("summary").textContent = bits.join(" · ");
  $("cToday").textContent = overdue.length + today.length + anytime.length || "";
  $("cUp").textContent = upcoming.length || ""; $("cDone").textContent = "";

  const list = $("list"); list.innerHTML = "";
  const section = (label, items, red) => { if(!items.length) return; const s = el("div", "section" + (red ? " red" : ""), label); list.appendChild(s); items.forEach(t => list.appendChild(row(t))); };
  if(view === "today"){
    section("Overdue", overdue, true); section("Today", today); section("Anytime", anytime);
    if(!overdue.length && !today.length && !anytime.length) list.innerHTML = '<div class="empty"><b>All clear</b>Type or say what you need to do below.</div>';
  }else if(view === "upcoming"){
    const groups = {}; upcoming.forEach(t => { const k = dayLabel(t.due); (groups[k] = groups[k] || []).push(t); });
    Object.entries(groups).forEach(([k, v]) => section(k, v));
    if(!upcoming.length) list.innerHTML = '<div class="empty"><b>Nothing upcoming</b>Add something like "dentist on friday at 3pm".</div>';
  }else{
    section("Completed", done);
    if(!done.length) list.innerHTML = '<div class="empty"><b>No completed tasks yet</b></div>';
  }
}
const byDue = (a, b) => a.due - b.due;
function el(tag, cls, text){ const e = document.createElement(tag); if(cls) e.className = cls; if(text != null) e.textContent = text; return e; }
function row(t){
  const r = el("div", "task" + (t.done ? " done" : "") + (t.high ? " high" : ""));
  const c = el("button", "check", t.done ? "✓" : ""); c.setAttribute("aria-label", t.done ? "Mark not done" : "Mark done");
  c.onclick = () => toggle(t.id);
  const b = el("div", "body"); b.onclick = () => openEdit(t.id);
  b.appendChild(el("div", "title", t.title));
  const chips = el("div", "chips");
  if(t.due) chips.appendChild(el("span", "chip" + (!t.done && t.due < Date.now() ? " late" : ""), fmtDue(t.due)));
  if(t.repeat) chips.appendChild(el("span", "chip rep", "↻ " + REP[t.repeat]));
  if(t.high) chips.appendChild(el("span", "chip pri", "High priority"));
  if(chips.children.length) b.appendChild(chips);
  r.append(c, b); return r;
}

// ================= ACTIONS =================
function addTask(text){
  const p = parse(text); if(!p.title) return;
  tasks.push({id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random()), ...p, done:false, notified:false, created:Date.now()});
  save();
  if(p.due && p.due >= addDays(new Date(), 1).getTime() && view === "today") toast(`Added for ${fmtDue(p.due)}`, "View", () => setView("upcoming"));
  else toast("Added");
  maybeAskNotif();
}
function toggle(id){
  const t = tasks.find(x => x.id === id); if(!t) return;
  if(t.done){ t.done = false; save(); return; }
  if(t.repeat){                                             // repeating: log a done copy, move this one forward
    tasks.push({...t, id: t.id + "-" + Date.now(), done:true, doneAt:Date.now(), repeat:null});
    const prev = t.due; t.due = nextOccurrence(t); t.notified = false; save();
    toast(`Done · next: ${fmtDue(t.due)}`, "Undo", () => { t.due = prev; tasks = tasks.filter(x => !(x.done && x.id.startsWith(t.id + "-") && Date.now() - x.doneAt < 15000)); save(); });
  }else{
    t.done = true; t.doneAt = Date.now(); save();
    toast("Done", "Undo", () => { t.done = false; save(); });
  }
}
function setView(v){ view = v; document.querySelectorAll(".tab").forEach(b => b.classList.toggle("on", b.dataset.view === v)); render(); }
document.querySelectorAll(".tab").forEach(b => b.onclick = () => setView(b.dataset.view));

// ---- composer with live preview ----
const input = $("text");
function updatePreview(){
  const v = input.value.trim(); if(!v){ $("preview").textContent = ""; return; }
  const p = parse(v), parts = [];
  parts.push(p.due ? "Due " + fmtDue(p.due) : "No date");
  if(p.repeat) parts.push(REP[p.repeat].toLowerCase()); if(p.high) parts.push("high priority");
  $("preview").textContent = `“${p.title || "…"}” — ${parts.join(" · ")}`;
}
input.addEventListener("input", updatePreview);
input.addEventListener("keydown", e => { if(e.key === "Enter"){ submit(); } });
$("add").onclick = submit;
function submit(){ const v = input.value.trim(); if(!v){ input.focus(); return; } addTask(v); input.value = ""; updatePreview(); }

// ---- voice ----
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if(!SR) $("mic").style.display = "none";
else{
  let rec = null;
  $("mic").onclick = () => {
    if(rec){ rec.stop(); return; }
    rec = new SR(); rec.lang = navigator.language || "en-US"; rec.interimResults = true;
    $("mic").classList.add("live");
    rec.onresult = e => { input.value = Array.from(e.results).map(r => r[0].transcript).join(""); updatePreview();
                          if(e.results[e.results.length - 1].isFinal){ setTimeout(submit, 400); } };
    rec.onerror = e => toast(e.error === "not-allowed" ? "Microphone permission denied" : "Didn't catch that — try again");
    rec.onend = () => { $("mic").classList.remove("live"); rec = null; };
    rec.start();
  };
}

// ---- edit sheet ----
function sheet(build){
  const s = $("sheet"); s.innerHTML = ""; build(s); $("toast").style.display = "none";
  s.classList.add("open"); $("scrim").classList.add("open");
}
function closeSheet(){ $("sheet").classList.remove("open"); $("scrim").classList.remove("open"); }
$("scrim").onclick = closeSheet;
const toLocalInput = ms => { const d = new Date(ms - new Date(ms).getTimezoneOffset() * 6e4); return d.toISOString().slice(0,16); };

function openEdit(id){
  const t = tasks.find(x => x.id === id); if(!t) return;
  sheet(s => {
    s.appendChild(el("h3", null, "Edit task"));
    s.appendChild(el("label", null, "Task"));
    const ti = el("input"); ti.type = "text"; ti.value = t.title; s.appendChild(ti);
    s.appendChild(el("label", null, "When"));
    const di = el("input"); di.type = "datetime-local"; if(t.due) di.value = toLocalInput(t.due); s.appendChild(di);
    const rw = el("div", "row");
    const rp = el("select"); [["","Doesn't repeat"],["daily","Every day"],["weekly","Every week"],["monthly","Every month"]].forEach(([v,l]) => { const o = el("option", null, l); o.value = v; if((t.repeat || "") === v) o.selected = true; rp.appendChild(o); });
    const pr = el("select"); [["0","Normal priority"],["1","High priority"]].forEach(([v,l]) => { const o = el("option", null, l); o.value = v; if(String(+!!t.high) === v) o.selected = true; pr.appendChild(o); });
    rw.append(rp, pr); s.appendChild(rw);

    s.appendChild(el("label", null, "Snooze"));
    const sn = el("div", "btns");
    const snooze = (label, fn) => { const b = el("button", "btn", label); b.onclick = () => { t.due = fn().getTime(); t.notified = false; t.done = false; save(); closeSheet(); toast("Snoozed to " + fmtDue(t.due)); }; sn.appendChild(b); };
    snooze("+1 hour", () => new Date(Date.now() + 36e5));
    snooze("Tonight 8pm", () => { const d = new Date(); d.setHours(20,0,0,0); return d <= new Date() ? addDays(d,1,true) : d; });
    snooze("Tomorrow 9am", () => { const d = addDays(new Date(), 1); d.setHours(9); return d; });
    snooze("Next week", () => { const d = addDays(new Date(), 7); d.setHours(9); return d; });
    s.appendChild(sn);

    const act = el("div", "btns");
    const saveB = el("button", "btn primary", "Save");
    saveB.onclick = () => {
      t.title = ti.value.trim() || t.title;
      const nd = di.value ? new Date(di.value).getTime() : null; if(nd !== t.due){ t.due = nd; t.notified = false; }
      t.repeat = rp.value || null; t.high = pr.value === "1"; save(); closeSheet();
    };
    const cal = el("button", "btn", "Add to Google Calendar");
    cal.onclick = () => window.open(gcalLink(t), "_blank");
    const del = el("button", "btn danger", "Delete");
    del.onclick = () => { const copy = {...t}; tasks = tasks.filter(x => x.id !== id); save(); closeSheet(); toast("Deleted", "Undo", () => { tasks.push(copy); save(); }); };
    act.append(saveB, cal, del); s.appendChild(act);
  });
}
function gcalLink(t){
  const start = new Date(t.due || Date.now() + 36e5), end = new Date(start.getTime() + 30 * 6e4);
  const f = d => d.toISOString().replace(/[-:]/g, "").replace(/\.\d{3}/, "");
  const q = new URLSearchParams({action:"TEMPLATE", text:t.title, dates:`${f(start)}/${f(end)}`, details:"Added from My Assistant"});
  if(t.repeat) q.set("recur", "RRULE:FREQ=" + t.repeat.toUpperCase());
  return "https://calendar.google.com/calendar/render?" + q;
}

// ---- settings ----
$("settingsBtn").onclick = () => sheet(s => {
  s.appendChild(el("h3", null, "Settings"));
  s.appendChild(el("label", null, "Your name (for the greeting)"));
  const n = el("input"); n.type = "text"; n.value = settings.name || ""; n.placeholder = "e.g. Madhu"; s.appendChild(n);
  const b1 = el("div", "btns");
  const sv = el("button", "btn primary", "Save"); sv.onclick = () => { settings.name = n.value.trim(); store(SKEY, settings); render(); closeSheet(); };
  const nt = el("button", "btn", "Notifications: " + notifState()); nt.onclick = async () => { await askNotif(); nt.textContent = "Notifications: " + notifState(); };
  const test = el("button", "btn", "Send test reminder"); test.onclick = () => notify("Test reminder", "This is how reminders will look.");
  b1.append(sv, nt, test); s.appendChild(b1);
  s.appendChild(el("label", null, "Backup"));
  const b2 = el("div", "btns");
  const ex = el("button", "btn", "Download backup"); ex.onclick = () => {
    const a = el("a"); a.href = URL.createObjectURL(new Blob([JSON.stringify({tasks, settings}, null, 2)], {type:"application/json"}));
    a.download = `assistant-backup-${new Date().toISOString().slice(0,10)}.json`; a.click(); };
  const im = el("button", "btn", "Restore backup"); const file = el("input"); file.type = "file"; file.accept = ".json,application/json"; file.hidden = true;
  im.onclick = () => file.click();
  file.onchange = async () => { try{ const d = JSON.parse(await file.files[0].text()); if(Array.isArray(d.tasks)){ tasks = d.tasks; settings = d.settings || settings; store(SKEY, settings); save(); closeSheet(); toast(`Restored ${tasks.length} tasks`); } }catch(e){ toast("That file isn't a valid backup"); } };
  b2.append(ex, im, file); s.appendChild(b2);
  s.appendChild(el("p", "note", "Your tasks are stored only on this phone. Reminders pop up while the app is open or running in the background. Android may stop them once the app has been closed for a while, so for must-not-miss items, tap a task and use \"Add to Google Calendar\"."));
});

// ================= REMINDERS =================
const notifState = () => !("Notification" in window) ? "not supported" : Notification.permission === "granted" ? "on" : Notification.permission === "denied" ? "blocked" : "off";
async function askNotif(){ if("Notification" in window && Notification.permission === "default"){ await Notification.requestPermission(); } updateBanners(); }
function maybeAskNotif(){ if(notifState() === "off" && tasks.some(t => t.due && !t.done)) $("notifBanner").hidden = false; }
$("notifBtn").onclick = askNotif;
async function notify(title, body){
  if(navigator.vibrate) navigator.vibrate([200, 100, 200]);
  if(notifState() === "on"){
    try{ const reg = await navigator.serviceWorker?.getRegistration(); if(reg){ reg.showNotification(title, {body, icon:"icon-192.png", badge:"icon-192.png", tag:title, renotify:true}); return; } }catch(e){}
    try{ new Notification(title, {body, icon:"icon-192.png"}); return; }catch(e){}
  }
  toast("⏰ " + title);
}
function checkReminders(){
  const now = Date.now(); let changed = false;
  tasks.forEach(t => {
    if(!t.done && t.due && !t.notified && t.due <= now){
      t.notified = true; changed = true;
      if(now - t.due < 6 * 36e5) notify(t.title, "Due " + fmtDue(t.due));      // skip ancient ones on first open
    }
  });
  if(changed) store(KEY, tasks);
  render();
}
setInterval(checkReminders, 20000);
document.addEventListener("visibilitychange", () => { if(!document.hidden) checkReminders(); });

// ================= INSTALL + OFFLINE =================
let deferred = null;
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferred = e; $("installBanner").hidden = false; });
$("installBtn").onclick = async () => { if(!deferred) return; deferred.prompt(); await deferred.userChoice; deferred = null; $("installBanner").hidden = true; };
window.addEventListener("appinstalled", () => { $("installBanner").hidden = true; toast("Installed — find it on your home screen"); });
if("serviceWorker" in navigator && location.protocol !== "file:") navigator.serviceWorker.register("sw.js").catch(() => {});
function updateBanners(){ $("notifBanner").hidden = !(notifState() === "off" && tasks.some(t => t.due && !t.done)); }

// ================= TOAST =================
let toastTimer;
function toast(msg, action, fn){
  const t = $("toast"); $("toastMsg").textContent = msg;
  const b = $("toastBtn"); b.textContent = action || ""; b.style.display = action ? "" : "none";
  b.onclick = () => { t.style.display = "none"; fn && fn(); };
  t.style.display = "flex"; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.style.display = "none", action ? 5000 : 2200);
}

updateBanners(); checkReminders();
</script>
</body>
</html>
